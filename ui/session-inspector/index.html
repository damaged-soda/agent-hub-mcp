<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Agent 会话检查器</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">A</span>
        <div>
          <h1>Agent 会话检查器</h1>
          <p>provider-native evidence · local read-only</p>
        </div>
      </div>
      <div class="privacy-badge" title="响应禁止缓存；正文只有显式操作才读取">
        <span class="privacy-dot" aria-hidden="true"></span>
        no-store
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar" aria-label="会话目录">
        <div class="sidebar-toolbar">
          <label>
            <span class="sr-only">按 provider 筛选</span>
            <select id="provider-filter">
              <option value="">全部 provider</option>
              <option value="codex">Codex</option>
              <option value="claude">Claude</option>
              <option value="kimi">Kimi</option>
            </select>
          </label>
          <button id="refresh-button" type="button">刷新</button>
        </div>
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="session-search" type="search" placeholder="搜索 cwd 或 session id" autocomplete="off">
        </label>
        <div id="session-count" class="session-count" aria-live="polite"></div>
        <nav id="session-list" class="session-list"></nav>
      </aside>

      <section id="detail" class="detail" aria-live="polite">
        <div class="empty-state">
          <div class="empty-glyph" aria-hidden="true">⌁</div>
          <h2>选择一个原生会话</h2>
          <p>这里会并排展示上下文证据、可用工具、实际调用和 turn 时间线。</p>
        </div>
      </section>
    </main>
  </body>
</html>
